name: Resources CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: resources-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - run: julia --startup-file=no test/runtests.jl

  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - AIMORACases
          - AIMORACatalogs
          - AIMORAReferenceModels
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Fetch public Cases dependencies
        if: matrix.package == 'AIMORACases'
        run: |
          git clone --depth 1 https://github.com/AIMORA-dev/AIMORA.jl.git "$RUNNER_TEMP/AIMORA.jl"
          git clone --depth 1 https://github.com/AIMORA-dev/AIMORAPlatform.git "$RUNNER_TEMP/AIMORAPlatform"
      - name: Test package
        env:
          AIMORA_CI_ENGINE_PATH: ${{ runner.temp }}/AIMORA.jl
          AIMORA_CI_FORMATS_PATH: ${{ runner.temp }}/AIMORAPlatform/AIMORAFormats
          AIMORA_CI_PROJECT_PATH: ${{ runner.temp }}/AIMORAPlatform/AIMORAProject
        run: |
          if [[ "${{ matrix.package }}" == "AIMORACases" ]]; then
            julia --startup-file=no --project=AIMORACases -e 'using Pkg; Pkg.develop([Pkg.PackageSpec(path=ENV["AIMORA_CI_ENGINE_PATH"]), Pkg.PackageSpec(path=ENV["AIMORA_CI_FORMATS_PATH"]), Pkg.PackageSpec(path=ENV["AIMORA_CI_PROJECT_PATH"])]); Pkg.test()'
          else
            julia --startup-file=no --project=${{ matrix.package }} -e 'using Pkg; Pkg.test()'
          fi

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - name: Fetch the public engine input
        run: git clone --depth 1 https://github.com/AIMORA-dev/AIMORA.jl.git "$RUNNER_TEMP/AIMORA.jl"
      - name: Build consolidated documentation
        env:
          AIMORA_DOCS_ENGINE_PATH: ${{ runner.temp }}/AIMORA.jl
        run: |
          julia --startup-file=no --project=docs -e 'using Pkg; Pkg.instantiate()'
          make -C docs build
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/build

  report-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - run: julia --startup-file=no report-templates/tests/runtests.jl

  historical-reference:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/cache@v2
      - run: make -C references/bpa_emtp check build test example

  deploy-documentation:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: documentation
    steps:
      - name: Deploy consolidated documentation
        id: deployment
        uses: actions/deploy-pages@v4
