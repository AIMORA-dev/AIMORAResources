name: Resources CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - run: julia --startup-file=no test/runtests.jl

  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - AIMORACases.jl
          - AIMORACatalogs.jl
          - AIMORAReferenceModels.jl
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - run: julia --startup-file=no --project=${{ matrix.package }} -e 'using Pkg; Pkg.test()'
