schema = "aimora-resource-artifact-policy-v1"
classification_precedes_removal = true

[baseline]
cases_commit = "25ced61dc6a70204f01b2429a6120682ccf0ea22"
tracked_csv = 130
tracked_svg = 108
tracked_pdf = 0
signature_schema = "frozen-git-tree-rows-sha256-v1"
signature = "e05b948a178c913989e8c5694e44de81591d1a651b6b1d4a6d98bda49a7df0d8"
disposition = "retain accepted migration baseline until individual evidence and ledger bindings are classified"

[defaults]
commit = ["canonical input/project", "reproducible runner", "README", "expected scalar metrics", "tolerances", "output schema", "result hashes", "small immutable independent reference", "selected educational figure", "provenance", "licence metadata"]
externalize = ["complete raw waveforms", "repeated render variants", "PDF reports", "build logs", "caches", "temporary summaries", "fitting intermediates", "duplicate output formats", "large checkpoints"]

[[classification]]
id = "accepted-case-csv-baseline"
glob = "AIMORACases.jl/examples/**/*.csv"
source_commit = "25ced61dc6a70204f01b2429a6120682ccf0ea22"
state = "retained"
reason = "The 130 CSV paths in the immutable accepted Cases migration commit are preserved; later CSV paths require their own classification."

[[classification]]
id = "accepted-case-svg-baseline"
glob = "AIMORACases.jl/examples/**/*.svg"
source_commit = "25ced61dc6a70204f01b2429a6120682ccf0ea22"
state = "retained"
reason = "The 108 SVG paths in the immutable accepted Cases migration commit are preserved; later SVG paths require their own classification."

[[classification]]
id = "native-extension-result-contract"
path = "AIMORACases.jl/examples/emt/user_defined_components/outputs/result_contract.csv"
state = "retained"
reason = "Small canonical typed result-contract table whose exact bytes and SHA-256 are accepted U200 public evidence."

[[classification]]
id = "native-extension-waveform"
path = "AIMORACases.jl/examples/emt/user_defined_components/outputs/waveform.csv"
state = "retained"
reason = "Bounded deterministic public waveform used for exact restart, task, event, KCL, and result-signature reproduction."

[[classification]]
id = "native-extension-curated-figure"
path = "AIMORACases.jl/examples/emt/user_defined_components/outputs/waveform.svg"
state = "retained"
reason = "One curated educational rendering of the accepted native-extension public case; repeated variants remain external by default."

[[classification]]
id = "generated-build-products"
glob = "**/build/**"
state = "external"
reason = "Compiled references and documentation are reproducible products, not tracked migration inputs."

[[exception]]
condition = "artifact is itself under qualification"
action = "retain"

[[exception]]
condition = "exact byte portability is tested or an accepted ledger record binds the artifact"
action = "retain"

[[exception]]
condition = "licence, small independent public oracle, or explicit public reproducibility promise requires repository retention"
action = "retain"
