schema_version = 3
title = "AIMORA local scientific reference package manifest"
checkout_root = ".aimora/cache/references/packages"
requirements_owner = "REQUIREMENTS.md#48-scientific-reference-packages-for-every-study"
status_command = "bin/aimora references status"
sync_command = "bin/aimora references sync"
update_command = "bin/aimora references update"
revision_policy = "Every Git checkout and official archive is locked here to exact content. Updating a pin requires explicit review of provenance, licence, scientific impact, and the resulting manifest diff."
usage_policy = "These packages are external review inputs, not AIMORA production dependencies or proof by themselves."
entry_policy = "Repository tables are shallow Git source checkouts. Package tables are named BPA provenance intakes; official archive entries retain readable source, build text, inputs, outputs, listings, PDF documents, and separately identified Excel workbooks, while classification states whether program source was actually present."
binary_policy = "ZIP containers and executables are excluded from official BPA intake trees. PDFs are retained under documents/ and Excel workbooks under workbooks/ as binary read-only material; neither counts as source or executable evidence."

